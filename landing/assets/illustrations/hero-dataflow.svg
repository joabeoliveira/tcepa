<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" fill="none" role="img" aria-label="Mapa do Brasil com pontos de dados de licitações e notas fiscais.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="520" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF4FF"/>
      <stop offset="1" stop-color="#E6FAF7"/>
    </linearGradient>
    <linearGradient id="mapFill" x1="80" y1="40" x2="280" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B5FFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00B3A6" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B5FFF" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="520" height="360" rx="24" fill="url(#bg)"/>
  <!-- Simplified Brazil silhouette (stylized) -->
  <path filter="url(#soft)" fill="url(#mapFill)" stroke="#0B5FFF" stroke-width="1.5" stroke-opacity="0.35"
    d="M210 48c28 6 52 18 68 42 14 20 22 42 18 66-3 18 6 28 18 36 16 10 28 26 24 46-4 18-18 30-36 36-14 4-22 16-20 30 2 16-8 30-24 34-20 5-42 2-58-10-12-9-28-10-42-4-18 8-38 4-50-10-14-16-18-38-10-56 6-14 2-30-8-40-14-14-18-34-10-52 8-18 24-30 44-34 10-2 18-10 22-20 8-18 30-28 54-24z"/>
  <!-- Data points -->
  <g>
    <circle cx="190" cy="120" r="5" fill="#0B5FFF"/>
    <circle cx="190" cy="120" r="12" fill="#0B5FFF" opacity="0.15"/>
    <circle cx="230" cy="150" r="5" fill="#00B3A6"/>
    <circle cx="230" cy="150" r="12" fill="#00B3A6" opacity="0.15"/>
    <circle cx="170" cy="180" r="5" fill="#0B5FFF"/>
    <circle cx="170" cy="180" r="12" fill="#0B5FFF" opacity="0.15"/>
    <circle cx="210" cy="210" r="5" fill="#00B3A6"/>
    <circle cx="210" cy="210" r="12" fill="#00B3A6" opacity="0.15"/>
    <circle cx="155" cy="230" r="5" fill="#0B5FFF"/>
    <circle cx="155" cy="230" r="12" fill="#0B5FFF" opacity="0.15"/>
    <circle cx="250" cy="190" r="5" fill="#0B5FFF"/>
    <circle cx="250" cy="190" r="12" fill="#0B5FFF" opacity="0.15"/>
  </g>
  <!-- Connection lines -->
  <g stroke="#0B5FFF" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="3 4">
    <path d="M190 120 L230 150 L210 210 L170 180"/>
    <path d="M230 150 L250 190 L210 210 L155 230"/>
  </g>
  <!-- Mini chart card -->
  <g transform="translate(320,48)">
    <rect width="160" height="100" rx="12" fill="#fff" stroke="#E2E8F0"/>
    <text x="14" y="24" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#475569">Licitações / mês</text>
    <rect x="18" y="70" width="14" height="18" rx="3" fill="#0B5FFF" opacity="0.4"/>
    <rect x="40" y="58" width="14" height="30" rx="3" fill="#0B5FFF" opacity="0.55"/>
    <rect x="62" y="48" width="14" height="40" rx="3" fill="#0B5FFF" opacity="0.7"/>
    <rect x="84" y="40" width="14" height="48" rx="3" fill="#00B3A6"/>
    <rect x="106" y="52" width="14" height="36" rx="3" fill="#0B5FFF" opacity="0.8"/>
    <rect x="128" y="36" width="14" height="52" rx="3" fill="#0B5FFF"/>
  </g>
  <!-- Code card -->
  <g transform="translate(300,180)">
    <rect width="190" height="140" rx="12" fill="#0F1724"/>
    <circle cx="18" cy="18" r="4" fill="#EF4444"/>
    <circle cx="32" cy="18" r="4" fill="#F59E0B"/>
    <circle cx="46" cy="18" r="4" fill="#10B981"/>
    <text x="14" y="48" font-family="JetBrains Mono, monospace" font-size="10" fill="#94A3B8">GET /api/pesquisa</text>
    <text x="14" y="68" font-family="JetBrains Mono, monospace" font-size="10" fill="#7DD3FC">?q=cimento</text>
    <text x="14" y="92" font-family="JetBrains Mono, monospace" font-size="10" fill="#94A3B8">{</text>
    <text x="22" y="110" font-family="JetBrains Mono, monospace" font-size="10" fill="#00B3A6">"total": 1284,</text>
    <text x="22" y="128" font-family="JetBrains Mono, monospace" font-size="10" fill="#A5B4FC">"sla": "99.9%"</text>
  </g>
</svg>
