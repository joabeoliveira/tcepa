version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pesquisa-precos-api
    ports:
      - "3000:3000"
    volumes:
      # Monta os XMLs e o banco como volume para persistência
      - ../:/app/xml-src:ro
      - ./data:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
