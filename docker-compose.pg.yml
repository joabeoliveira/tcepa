# API de Pesquisa de Preços com PostgreSQL
# Uso no EasyPanel: aponte o Compose File para este arquivo na raiz

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: tcepa-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: tcepa
      POSTGRES_USER: tcepa
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tcepa123}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcepa"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile.pg
    container_name: tcepa-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: tcepa
      DB_USER: tcepa
      DB_PASSWORD: ${DB_PASSWORD:-tcepa123}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
